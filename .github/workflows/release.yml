name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Notes from CHANGELOG
        run: |
          v=$(cat VERSION)
          awk -v v="$v" '$0 ~ "^## \\[?" v "\\]?([ ]|$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
